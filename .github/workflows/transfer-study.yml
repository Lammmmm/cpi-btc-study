name: Transfer original CPI files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-study.yml'
      - 'tools/transfer_study_bundle.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cpi-encrypted-file-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'Lammmmm/cpi-btc-study'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Test import safety
        run: python3 tools/import_study_bundle.py --self-test
      - name: Receive and verify original CPI files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/transfer_study_bundle.py
