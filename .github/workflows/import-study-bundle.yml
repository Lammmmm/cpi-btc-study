name: Import original CPI study bundle
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag containing the original delivery ZIP
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: cpi-study-bundle-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Lammmmm/cpi-btc-study'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Validate importer safety
        run: python3 tools/import_study_bundle.py --self-test
      - name: Import and audit original delivery archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: python3 tools/import_study_bundle.py --release-tag "$RELEASE_TAG"
      - name: Commit verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deliverables cpi_upgrade figures README.md DELIVERABLES_SHA256.json UPLOAD_AUDIT.json
          if git diff --cached --quiet; then
            echo 'No imported file changes.'
            exit 0
          fi
          git commit -m 'Import original CPI study delivery, sources, data and tests'
          git push origin HEAD:main
      - name: Publish import audit
        run: |
          echo '### CPI bundle import audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'File integrity and row counts only; this import does not rerun the backtest.' >> "$GITHUB_STEP_SUMMARY"
          cat UPLOAD_AUDIT.json >> "$GITHUB_STEP_SUMMARY"
